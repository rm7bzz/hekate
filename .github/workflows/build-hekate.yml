name: Build Hekate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up layout test runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build
        run: |
          gcc -std=gnu11 -Ibdk -ffunction-sections -fdata-sections -Wl,--gc-sections tests/test_usb_input.c -o /tmp/test-usb-input
          /tmp/test-usb-input
          node tests/test_usb_layout.cjs --keys
          make clean
          make

      - name: Prepare artifact name
        run: |
          SAFE_REF=$(printf '%s' "$GITHUB_REF_NAME" | tr '/' '-')
          echo "SAFE_REF=$SAFE_REF" >> "$GITHUB_ENV"

      - name: Bundle artifacts
        run: |
          mkdir -p artifacts
          cp output/hekate.bin output/hekate_unc.bin output/nyx.bin artifacts/
          tar -czf "hekate-${SAFE_REF}-${GITHUB_SHA}.tar.gz" -C artifacts .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hekate-${{ env.SAFE_REF }}-${{ github.sha }}
          path: hekate-${{ env.SAFE_REF }}-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 14
