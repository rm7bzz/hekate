name: Build Hekate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          make clean
          make

      - name: Prepare artifact name
        run: |
          SAFE_REF=$(printf '%s' "$GITHUB_REF_NAME" | tr '/' '-')
          echo "SAFE_REF=$SAFE_REF" >> "$GITHUB_ENV"

      - name: Bundle artifacts
        run: |
          mkdir -p artifacts
          cp -f output/hekate.bin artifacts/ || true
          cp -f output/hekate_unc.bin artifacts/ || true
          cp -f output/nyx.bin artifacts/ || true
          cp -f bootloader/update.bin artifacts/ || true
          tar -czf "hekate-${SAFE_REF}-${GITHUB_SHA}.tar.gz" -C artifacts .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hekate-${{ env.SAFE_REF }}-${{ github.sha }}
          path: hekate-${{ env.SAFE_REF }}-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 14
